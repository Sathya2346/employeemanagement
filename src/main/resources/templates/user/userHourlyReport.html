<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>User || Hourly Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/user/userDashboard.css}">
</head>
<body>
    <div class="d-flex flex-column flex-lg-row min-vh-100">
        <!-- Sidebar -->
        <div class="sidebar text-white p-3 flex-shrink-0" id="sidebar" style="min-width: 230px;">
            <!-- Close Button for Medium devices -->
            <button class="btn btn-outline-light d-md-block d-lg-none mb-3" id="closeSidebar">
                <i class="bi bi-x-lg"></i>
            </button>

            <h4>EMS</h4>
            <nav class="nav flex-column mt-3">
                <a th:href="@{/user/userDashboard/{id}(id=${employee.id})}" class="nav-link text-white"><i class="bi bi-house me-2"></i>Overview</a>
                <a th:href="@{/user/userProfile/{id}(id=${employee.id})}" class="nav-link text-white"><i class="bi bi-person me-2"></i>Profile</a>
                <a th:href="@{/user/userAttendance/{id}(id=${employee.id})}" class="nav-link text-white"><i class="bi bi-clock me-2"></i>Attendance</a>
                <a th:href="@{/leave/userLeave/{id}(id=${employee.id})}" class="nav-link text-white"><i class="bi bi-calendar me-2"></i>Leave</a>
                <a th:href="@{/user/hourlyReport/{id}(id=${employee.id})}" class="nav-link active bg-secondary rounded"><i class="bi bi-clock-history me-2"></i>Hourly Report</a>
                <a th:href="@{/user/notification/{id}(id=${employee.id})}" class="nav-link text-white"><i class="bi bi-bell me-2"></i>Notification</a>
                <a th:href="@{/logout}" id="logoutLink" class="nav-link text-white"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
            </nav>
        </div>

  <!-- Main Content -->
  <div id="content" class="flex-grow-1 main-content">
    <button class="btn btn-outline-secondary d-lg-none mb-3" id="sidebarToggle">
      <i class="bi bi-list"></i>
    </button>

    <div class="navbar-custom mb-4">
      <div class="navbar-left">
        <h4 class="fw-bold text-secondary mb-0"><i class="bi bi-clock-history me-2"></i>Hourly Work Report</h4>
      </div>
    </div>

    <div class="container-fluid px-0 px-sm-3 mt-3">
      <form id="hourlyForm">
        <div class="card shadow-sm border-0 rounded-4 p-3 p-md-4 bg-white">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0 text-dark">Submit Work Entries</h5>
            <button type="button" class="btn btn-sm btn-outline-success add-row px-3 fw-semibold">
              <i class="bi bi-plus-lg me-1"></i> Add Entry
            </button>
          </div>

          <div class="table-responsive border rounded-3 p-2 bg-white">
            <table class="table table-borderless align-middle mb-0 text-center w-100" id="reportTable">
              <thead class="table-light">
                <tr class="text-nowrap">
                  <th class="text-center" style="width: 25%; min-width: 140px;">Time Slot</th>
                  <th style="width: 45%; min-width: 200px;">Task Description</th>
                  <th style="width: 20%; min-width: 130px;">Status</th>
                  <th class="text-center" style="width: 10%; min-width: 50px;">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="text-center">
                    <input type="text" class="form-control time-slot text-center" placeholder="e.g. 10:00 AM - 11:00 AM">
                  </td>
                  <td>
                    <textarea class="form-control task-desc" rows="2" placeholder="Enter task details..."></textarea>
                  </td>
                  <td>
                    <select class="form-select status">
                      <option>In Progress</option>
                      <option>Completed</option>
                      <option>Pending Review</option>
                      <option>In Meeting</option>
                    </select>
                  </td>
                  <td class="text-center">
                    <button type="button" class="btn btn-sm btn-success add-row" title="Add Row"><i class="bi bi-plus-lg"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-5 py-2 fw-semibold rounded-3 shadow-sm">
              <i class="bi bi-send me-1"></i> Submit All Reports
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Dynamic Row Addition
  const tableBody = document.querySelector("#reportTable tbody");

  document.addEventListener("click", (e) => {
    if (e.target.closest(".add-row")) {
      const newRow = document.createElement("tr");
      newRow.innerHTML = `
        <td class="text-center">
          <input type="text" class="form-control form-control-sm time-slot text-center" placeholder="e.g. 11:00 AM - 12:00 PM" style="min-width: 140px;">
        </td>
        <td>
          <textarea class="form-control form-control-sm task-desc" rows="2" placeholder="Enter task details..." style="min-width: 220px;"></textarea>
        </td>
        <td>
          <select class="form-select form-select-sm status" style="min-width: 140px;">
            <option>In Progress</option>
            <option>Completed</option>
            <option>Pending Review</option>
            <option>In Meeting</option>
          </select>
        </td>
        <td class="text-center">
          <button type="button" class="btn btn-outline-danger btn-sm remove-row" title="Remove Row"><i class="bi bi-trash"></i></button>
        </td>
      `;
      tableBody.appendChild(newRow);
    }

    if (e.target.closest(".remove-row")) {
      e.target.closest("tr").remove();
    }
  });

  // Form submission
  document.getElementById("hourlyForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const employeeId = "[[${employee.id}]]";
    const employeeName = "[[${employee.firstname}]] [[${employee.lastname}]]";
    const rows = document.querySelectorAll("tbody tr");
    const reports = [];

    rows.forEach((row) => {
      const timeSlot = row.querySelector(".time-slot")?.value.trim();
      const task = row.querySelector(".task-desc")?.value.trim();
      const status = row.querySelector(".status")?.value;
      if (timeSlot && task) {
        reports.push({ employeeId, employeeName, timeSlot, taskDescription: task, status });
      }
    });

    if (reports.length === 0) {
      alert("Please enter at least one time slot and task description before submitting.");
      return;
    }

    try {
      const res = await fetch("/user/submitHourlyReports", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(reports)
      });

      if (res.ok) {
        alert("Hourly report submitted successfully!");
        location.reload();
      } else {
        alert("Error submitting reports.");
      }
    } catch (err) {
      console.error(err);
      alert("Network error. Please try again.");
    }
  });

  // Sidebar toggle
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');
  const closeSidebar = document.getElementById('closeSidebar');

  sidebarToggle?.addEventListener('click', () => {
    sidebar?.classList.add('active-sidebar');
    sidebar?.classList.add('active');
  });

  closeSidebar?.addEventListener('click', () => {
    sidebar?.classList.remove('active-sidebar');
    sidebar?.classList.remove('active');
  });
</script>
<script th:src="@{/js/idleTracker.js}"></script>
<script th:src="@{/js/userLogoutGuard.js}"></script>

</body>
</html>
