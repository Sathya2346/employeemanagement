spring.application.name=employeemanagement
server.port=8080

# ── Database configuration ─────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/employeemanagement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&maxAllowedPacket=67108864}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Multipart File Upload Limits ─────────────────────────────────────
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# HikariCP connection pool – tuned for cloud free-tier databases
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
# -1 = pool starts even if DB unreachable → Tomcat binds port → Render detects it
spring.datasource.hikari.initialization-fail-timeout=-1

# Lazy DB init – Tomcat starts and binds port BEFORE connecting to DB
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Force TLSv1.2 – fixes SSL handshake on Alpine Linux with TiDB Cloud
spring.jpa.properties.hibernate.connection.enabledTLSProtocols=TLSv1.2,TLSv1.3

# --- Session Management (Scalability) ---
# spring.session.store-type=jdbc
# spring.session.jdbc.initialize-schema=always

# --- Observability (Actuator) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# --- Thymeleaf and Logging ---
spring.thymeleaf.cache=false
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.session=WARN

# --- Session Cookie Settings (Fix mobile browser session issue) ---
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=false
server.servlet.session.timeout=3600
# Allow URL-based session tracking as fallback when cookie is blocked
server.servlet.session.tracking-modes=cookie,url
# Exclude FORWARD dispatch from security filter to prevent session context overwrite
spring.security.filter.dispatcher-types=async,error,request

# --- Mail Configuration ---
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Kolkata Time
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Maximum size allowed for each individual file
spring.servlet.multipart.max-file-size=50MB
# Maximum total size allowed for the entire form submission
spring.servlet.multipart.max-request-size=200MB
# PREVENT PREMATURE PARSING (Crucial for Connection Reset)
spring.servlet.multipart.resolve-lazily=true

# Increases the amount of data Tomcat is willing to "swallow" when a limit is hit
server.tomcat.max-swallow-size=200MB

# Increases the maximum size of the HTTP POST body for Tomcat
server.tomcat.max-http-form-post-size=200MB

# INCREASE TIMEOUTS (Give the server more time to receive data)
server.connection-timeout=300000
server.tomcat.connection-timeout=300000
server.tomcat.keep-alive-timeout=300000
server.tomcat.max-keep-alive-requests=100

server.port=${PORT:8085}
