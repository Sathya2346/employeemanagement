spring.application.name=employeemanagement

# ── MySQL Database ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/employeemanagement
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Multipart File Upload Limits ───────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.resolve-lazily=true

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=-1

# Lazy DB init
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.enabledTLSProtocols=TLSv1.2,TLSv1.3

# --- H2 Console (disabled when using MySQL) ---
spring.h2.console.enabled=false

# --- Session Management ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie,url

# Exclude FORWARD dispatch from security filter
spring.security.filter.dispatcher-types=async,error,request

# --- Observability (Actuator) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Thymeleaf and Logging ---
spring.thymeleaf.cache=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.session=WARN

# --- Mail Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
